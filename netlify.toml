[build]
  publish = "dist"
  command = "npm run build"

# Handle SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# what-we-do has been deprecated and consolidated into the home page
[[redirects]]
  from = "/what-we-do"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/what-we-do/"
  to = "/"
  status = 301
  force = true

# Remove trailing slashes for consistency

[[redirects]]
  from = "/scopes-materials/"
  to = "/scopes-materials"
  status = 301

[[redirects]]
  from = "/project-portfolio/"
  to = "/project-portfolio"
  status = 301

[[redirects]]
  from = "/contact-us/"
  to = "/contact-us"
  status = 301

[[redirects]]
  from = "/resources/"
  to = "/resources"
  status = 301
